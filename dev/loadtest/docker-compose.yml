# Load-test stack. Never point this at a live install or real hosts.
# See README.md. unbork runs the published image of the code under test.
name: unbork-loadtest

x-fakehost-log: &small-log
  driver: json-file
  options: { max-size: "1m", max-file: "1" }

services:
  postgres:
    image: postgres:18-alpine
    # 100 (the default) is too few for the raised config: run_one.sh sets 400 there.
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_USER: unbork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./prepare.sh first}
      POSTGRES_DB: unbork
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unbork"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [loadtest]

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [loadtest]

  unbork:
    container_name: unbork-loadtest
    image: ${UNBORK_IMAGE:-openlabdog/labdog:dev-5cb85d7}  # old-name-ok: this tag was published there
    environment:
      UNBORK_DATABASE__URL: postgresql+asyncpg://unbork:${POSTGRES_PASSWORD}@postgres:5432/unbork
      UNBORK_REDIS__URL: redis://redis:6379/0
      UNBORK_SECURITY__SECRET_KEY: ${UNBORK_SECURITY__SECRET_KEY:?run ./prepare.sh first}
      UNBORK_SECURITY__ENCRYPTION_KEY: ${UNBORK_SECURITY__ENCRYPTION_KEY:?run ./prepare.sh first}
      UNBORK_SECURITY__COOKIE_SECURE: "false"
      UNBORK_RATE_LIMIT__ENABLED: "false"
      UNBORK_CELERY__CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      UNBORK_CELERY__ORCHESTRATOR_CONCURRENCY: ${ORCHESTRATOR_CONCURRENCY:-4}
    volumes:
      - ./pack:/srv/loadtest-pack:ro
      # Images before the BUG-128 fix need ansible.posix for linux-user
      # sync (see README); prepare.sh fetches it.
      - ./.state/collections:/usr/share/ansible/collections:ro
    # Loopback only: the stack has throwaway credentials.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "2" }
    networks: [loadtest]

  fakehost:
    image: unbork-loadtest-fakehost:latest
    build:
      context: .
      dockerfile: fakehost/Dockerfile
    environment:
      NETEM_DELAY_MS: ${NETEM_DELAY_MS:-20}
    mem_limit: ${FAKEHOST_MEM_LIMIT:-128m}
    # NET_ADMIN for netem. SYS_ADMIN + unconfined AppArmor so the entrypoint
    # can drop Docker's bind mounts over /etc/hosts and /etc/resolv.conf,
    # which Ansible's atomic rename cannot replace.
    cap_add: [NET_ADMIN, SYS_ADMIN]
    security_opt: ["apparmor=unconfined"]
    logging: *small-log
    networks: [loadtest]

networks:
  loadtest:
    # Two-host mode (FAKEHOST_DOCKER, see README): fake hosts get 172.30/16
    # with nat-unprotected so unbork on the other box can reach them by a
    # plain route; the unbork side moves to 172.29/16.
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: ${LT_GW_MODE:-nat}
    ipam:
      config:
        - subnet: ${LT_SUBNET:-172.30.0.0/16}

volumes:
  postgres_data:
