# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: unbork
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
maintainer: "unbork Maintainers <noreply@github.com>"
description: |
  unbork — a homelabber's best friend.
  Linux node configuration management platform. Manages firewall rules,
  services, users, cron jobs, /etc/hosts, and more using Ansible under
  the hood with a web UI and drift detection.
  Requires PostgreSQL 14+ and Redis 6+.
homepage: https://github.com/open-unbork/unbork
license: AGPL-3.0-or-later

# Runtime deps (Python deps bundled in venv).
# `python3.12` is the package name on Ubuntu 24.04+, Debian 13+, and
# RHEL/Rocky/Fedora 9+ AppStream — the supported distros. We need the
# binary at /usr/bin/python3.12 specifically because the bundled venv
# symlinks to it. The earlier `python3 (>= 3.12)` checked apt's
# `python3` virtual package, which is 3.11 on Debian 12 and so failed
# the dep check even when /usr/bin/python3.12 was present.
depends:
  - python3.12

recommends:
  - postgresql-client
  - redis-tools

contents:
  # ── Application code (venv + backend + frontend) ──────────────────────
  - src: staging/usr/lib/unbork/
    dst: /usr/lib/unbork/
    type: tree
    file_info:
      owner: root
      group: root
      mode: 0755

  # ── Config file (config|noreplace — preserved on upgrade) ─────────────
  - src: etc/unbork.toml
    dst: /etc/unbork/unbork.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: unbork

  # ── Systemd units ──────────────────────────────────────────────────────
  - src: systemd/unbork.service
    dst: /usr/lib/systemd/system/unbork.service

  # ── tmpfiles.d ─────────────────────────────────────────────────────────
  - src: tmpfiles.d/unbork.conf
    dst: /usr/lib/tmpfiles.d/unbork.conf

  # ── Owned directories ──────────────────────────────────────────────────
  - dst: /etc/unbork/
    type: dir
    file_info:
      owner: root
      group: unbork
      mode: 0750
  - dst: /var/lib/unbork/
    type: dir
    file_info:
      owner: unbork
      group: unbork
      mode: 0750
  - dst: /var/log/unbork/
    type: dir
    file_info:
      owner: unbork
      group: unbork
      mode: 0750

scripts:
  preinstall:  scripts/preinst.sh
  postinstall: scripts/postinst.sh
  preremove:   scripts/prerm.sh
  postremove:  scripts/postrm.sh

deb:
  compression: zstd

overrides:
  rpm:
    depends:
      - python3.12
    recommends:
      - postgresql
      - redis
