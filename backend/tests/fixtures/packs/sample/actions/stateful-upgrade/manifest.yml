key: stateful-upgrade
name: Upgrade a stateful application
description: Per-host destructive action with quiesce and unquiesce playbooks.
icon: Database
playbook: playbook.yml
version: "1.0"
estimated_duration: "5 min"
destructive: true
supports_group: true
supports_host: true
quiesce_playbook: quiesce.yml
unquiesce_playbook: unquiesce.yml
quiesce_timeout_seconds: 120
parameters:
  - key: fail_on_purpose
    label: Make the main playbook fail
    type: bool
    default: false
